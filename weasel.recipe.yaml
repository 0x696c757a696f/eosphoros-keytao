# encoding: utf-8
---
recipe:
  Rx: weasel
  description: >-
    为 Windows 小狼毫安装或更新星猫键道6，并安装小狼毫样式与方案图标。
install_files: >-
  default.yaml
  liangfen*.yaml
  pinyin_simp*.yaml
  xmjd6.*.dict.yaml
  dicts/xmjd6/*.dict.yaml
  xmjd6.*.schema.yaml
  xmjd6.schema.yaml
  xmjd6.symbols.yaml
  xmjd6.custom.yaml
  lua/xmjd6/*.lua
  lua/xmjd6/*/*.lua
  opencc/xmjd6/*.lua
  zzc_state/char_parts.tsv
  zzc/README.md
  zzc/自造词使用教程.md
  zzc/自造词使用教程.png
  zzc/xmjd6_词库合并.py
  zzc/xmjd6_撤回合并.py
  zzc/Win_词库合并.exe
  zzc/Win_撤回合并.exe
  zzc/Windows_词库合并.py
  zzc/Windows_撤回合并.py
  weasel.yaml
  xmjd6.ico
patch_files:
  default.custom.yaml:
    - patch/+:
        schema_list/+/+:
          - schema: xmjd6
