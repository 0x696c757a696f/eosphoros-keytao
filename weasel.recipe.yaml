  description: >-
    为 Windows 小狼毫安装或更新晨星键道，并安装小狼毫样式与方案图标。
install_files: >-
  default.yaml
  liangfen*.yaml
  pinyin_simp*.yaml
  eosphoros*.ico
  eosphoros.*.dict.yaml
  dicts/eosphoros/*.dict.yaml
  eosphoros.*.schema.yaml
  eosphoros.schema.yaml
  eosphoros.symbols.yaml
  eosphoros.custom.yaml
  lua/eosphoros/*.lua
  lua/eosphoros/*/*.lua
  opencc/eosphoros/*.lua
  zzc_state/char_parts.tsv
  zzc/README.md
  zzc/自造词使用教程.md
  zzc/自造词使用教程.png
  zzc/eosphoros_词库合并.py
  zzc/eosphoros_撤回合并.py
  zzc/Win_词库合并.exe
  zzc/Win_撤回合并.exe
  zzc/Windows_词库合并.py
  zzc/Windows_撤回合并.py
  weasel.yaml
patch_files:
  default.custom.yaml:
    - patch/+:
        schema_list/+/+:
          - schema: eosphoros
