#!/usr/bin/yong-config
# 晨星键道的小小输入法配置；发布时以 UTF-8 BOM 写入便携包。

[DESC]
version=2

[IM]
default=0
0=eosphoros
cand=5
s2t_m=0
filter=0
enable=0
skin=skin
enter=default
space=default
caps_bd=1
ABCD=1
sym_in_num=.,;
onspot=1
preedit=0
auto_move=0
auto_add=0
keypad=0
output=3

[main]
tray=1
pos=0
tip=1

[input]
hint=1
noshow=0
strip=32 32;32 32
a_caret=1

[key]
# Ctrl + 空格启用；Shift 切换中英文。
trigger=CTRL_SPACE
select=; \'
CNen=SHIFT
tEN=!
ishow=`
page=- =
w2c=[ ]
filter=\\
switch=RALT
switch_default=CTRL_`
s2t=ALT_.
corner=CTRL_,
biaodian=CTRL_.
zi_switch=ALT_/
repeat=RSHIFT
query=CTRL_/
py_switch=TAB
replace=[ BACKSPACE
esc=CAPSLOCK

[eosphoros]
name=晨星键道
engine=libmb.so
arg=mb/eosphoros/eosphoros.txt
beep=none

[sync]
