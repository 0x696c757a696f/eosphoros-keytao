name: Package Master Branch

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: package-master-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  PYTHONNOUSERSITE: "1"
  OPENCC_TONGGUI_URL: https://github.com/amorphobia/opencc-tonggui/releases/download/latest/opencc-tonggui.zip
  OPENCC_TONGGUI_SHA256: 1b76a1028669b89d55a9055400e8be628014ea6f3b200b34b5e8a7d88f04e018

jobs:
  input-behavior:
    name: Rime behavior (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: current
            binary: mira-rimemaster-lua5.4
            sha256: 62c7141ce1613ba46b5bed87ce7c6018374dc4a9c6f3037c5109e524a76168dc
          - name: stable
            binary: mira-rime1.13.1-luajit
            sha256: 70080e5e01ed6a6c31040ba8c64aa7a3faaaa64e1d3eb0dbcbbee3fffa9a4754
    steps:
    - uses: actions/checkout@v7

    - name: Install Rime Prelude for the isolated test workspace
      run: |
        sudo apt-get update
        sudo apt-get install -y rime-prelude
        cp --no-clobber /usr/share/rime-data/*.yaml .

    - name: Download verified Mira runtime
      env:
        MIRA_BINARY: ${{ matrix.binary }}
        MIRA_SHA256: ${{ matrix.sha256 }}
      run: |
        curl --fail --location --retry 3 \
          --output "$MIRA_BINARY" \
          "https://github.com/rimeinn/mira/releases/download/latest/$MIRA_BINARY"
        echo "$MIRA_SHA256  $MIRA_BINARY" | sha256sum --check --strict
        chmod +x "$MIRA_BINARY"

    - name: Test real input behavior
      env:
        MIRA_BINARY: ${{ matrix.binary }}
      run: |
        set +e
        output=$("./$MIRA_BINARY" -C .tmp/mira-cache tests/eosphoros.mira.test.yaml 2>&1)
        status=$?
        set -e
        printf '%s\n' "$output"
        if [ "$status" -ne 0 ]; then
          escaped=${output//'%'/'%25'}
          escaped=${escaped//$'\r'/'%0D'}
          escaped=${escaped//$'\n'/'%0A'}
          echo "::error title=Mira input behavior failed::$escaped"
          exit "$status"
        fi

  tests:
    name: Python tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: shard 1/3 + Lua
            index: 0
            run_lua: true
          - name: shard 2/3
            index: 1
            run_lua: false
          - name: shard 3/3
            index: 2
            run_lua: false

    steps:
    - uses: actions/checkout@v7

    - uses: ./.github/actions/setup-pixi

    - name: Run test shard
      env:
        SHARD_INDEX: ${{ matrix.index }}
        RUN_LUA: ${{ matrix.run_lua }}
      run: |
        pixi run test-shard --index "$SHARD_INDEX" --count 3
        if [ "$RUN_LUA" = "true" ]; then
          pixi run lua tests/run.lua
        fi

  generated-quality:
    name: Generated and quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v7

    - uses: ./.github/actions/setup-pixi

    - name: Validate source and generated files
      run: |
        pixi run quality
        pixi run generated-quick
        git diff --check

    - uses: ./.github/actions/check-workflows

  build-native:
    name: Build native packages
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v7

    - name: Compute native package fingerprint
      id: native-fingerprint
      shell: bash
      run: echo "value=$(python tools/native_ci_fingerprint.py)" >> "$GITHUB_OUTPUT"

    - name: Restore exact native package cache
      id: native-cache
      uses: actions/cache@v6
      with:
        path: eosphoros-fcitx5-*.zip
        key: native-packages-v1-${{ runner.os }}-${{ steps.native-fingerprint.outputs.value }}

    - if: steps.native-cache.outputs.cache-hit != 'true'
      uses: ./.github/actions/setup-pixi

    - name: Install native compilers
      if: steps.native-cache.outputs.cache-hit != 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -y librime-bin librime-plugin-lua rime-prelude libime-bin

    - if: steps.native-cache.outputs.cache-hit != 'true'
      uses: ./.github/actions/fetch-opencc
      with:
        url: ${{ env.OPENCC_TONGGUI_URL }}
        sha256: ${{ env.OPENCC_TONGGUI_SHA256 }}

    - name: Build Fcitx5 packages and compile Rime core in parallel
      if: steps.native-cache.outputs.cache-hit != 'true'
      run: |
        pixi run python tools/build_fcitx5_table.py \
          --compiler "$(command -v libime_tabledict)" &
        fcitx_pid=$!
        pixi run python tools/smoke_test_rime_deployment.py \
          --shared-data-dir /usr/share/rime-data &
        rime_pid=$!
        status=0
        wait "$fcitx_pid" || status=$?
        wait "$rime_pid" || status=$?
        exit "$status"

    - name: Upload complete build
      uses: actions/upload-artifact@v7
      with:
        name: eosphoros
        path: |
          **/*
          !.git/**
          !.github/**
          !.git*
          !native/**
          !packaging/fcitx5/**
          !yong*.*
          !tests/**
          !tools/**
          !VERSION
          !requirements*.txt
        if-no-files-found: error
