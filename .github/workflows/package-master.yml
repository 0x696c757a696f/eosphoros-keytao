name: Package Master Branch

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  PYTHONNOUSERSITE: "1"
  OPENCC_TONGGUI_URL: https://github.com/amorphobia/opencc-tonggui/releases/download/latest/opencc-tonggui.zip
  OPENCC_TONGGUI_SHA256: 1b76a1028669b89d55a9055400e8be628014ea6f3b200b34b5e8a7d88f04e018

jobs:
  input-behavior:
    name: Rime behavior (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: current
            binary: mira-rimemaster-lua5.4
            sha256: 62c7141ce1613ba46b5bed87ce7c6018374dc4a9c6f3037c5109e524a76168dc
          - name: stable
            binary: mira-rime1.13.1-luajit
            sha256: 70080e5e01ed6a6c31040ba8c64aa7a3faaaa64e1d3eb0dbcbbee3fffa9a4754
    steps:
    - uses: actions/checkout@v7

    - name: Install Rime Prelude for the isolated test workspace
      run: |
        sudo apt-get update
        sudo apt-get install -y rime-prelude
        cp --no-clobber /usr/share/rime-data/*.yaml .

    - name: Download verified Mira runtime
      env:
        MIRA_BINARY: ${{ matrix.binary }}
        MIRA_SHA256: ${{ matrix.sha256 }}
      run: |
        curl --fail --location --retry 3 \
          --output "$MIRA_BINARY" \
          "https://github.com/rimeinn/mira/releases/download/latest/$MIRA_BINARY"
        echo "$MIRA_SHA256  $MIRA_BINARY" | sha256sum --check --strict
        chmod +x "$MIRA_BINARY"

    - name: Test real input behavior
      env:
        MIRA_BINARY: ${{ matrix.binary }}
      run: |
        set +e
        output=$("./$MIRA_BINARY" -C .tmp/mira-cache tests/eosphoros.mira.test.yaml 2>&1)
        status=$?
        set -e
        printf '%s\n' "$output"
        if [ "$status" -ne 0 ]; then
          escaped=${output//'%'/'%25'}
          escaped=${escaped//$'\r'/'%0D'}
          escaped=${escaped//$'\n'/'%0A'}
          echo "::error title=Mira input behavior failed::$escaped"
          exit "$status"
        fi

  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        python-version: '3.14'
        check-latest: true

    - name: Validate source tree
      run: |
        sudo apt-get update
        sudo apt-get install -y lua5.4 librime-bin librime-plugin-lua rime-prelude
        python -m pip install --upgrade -r requirements-ci.txt
        python -m pip install -r requirements-dev.txt
        python tools/validate_repo.py
        python tools/audit_long_dictionary_entries.py --check
        lua5.4 tests/run.lua
        python -m unittest discover -s tests -p 'test_*.py' -v

    - name: Download verified OpenCC data
      run: |
        python tools/fetch_opencc.py \
          --url "$OPENCC_TONGGUI_URL" \
          --sha256 "$OPENCC_TONGGUI_SHA256" \
          --destination opencc/eosphoros

    - name: Validate platform package manifests
      run: python tools/build_platform_packages.py --check

    - name: Compile packaged core with librime and Lua
      run: python tools/smoke_test_rime_deployment.py --shared-data-dir /usr/share/rime-data

    - name: Validate Fcitx5 themes
      run: python tools/build_fcitx5_themes.py --check

    - name: Validate native mobile themes
      run: python tools/build_mobile_themes.py --check

    - uses: actions/upload-artifact@v7
      with:
        name: fcitx5-linux-eosphoros-themes
        path: fcitx5/linux/themes/**/*
        if-no-files-found: error

    - uses: actions/upload-artifact@v7
      with:
        name: fcitx5-macos-eosphoros-themes
        path: fcitx5/macos/themes/*.conf
        if-no-files-found: error

    - uses: actions/upload-artifact@v7
      with:
        name: fcitx5-android-eosphoros-themes
        path: mobile_themes/fcitx5-android/*.zip
        if-no-files-found: error

    - uses: actions/upload-artifact@v7
      with:
        name: trime-eosphoros-theme
        path: mobile_themes/trime/eosphoros.trime.yaml
        if-no-files-found: error

    - uses: actions/upload-artifact@v7
      with:
        name: eosphoros
        path: |
          **/*
          !.git/**
          !.github/**
          !.git*
          !fcitx5/**
          !mobile_themes/**
          !yong*.*
          !tests/**
          !tools/**
          !VERSION
          !requirements*.txt
