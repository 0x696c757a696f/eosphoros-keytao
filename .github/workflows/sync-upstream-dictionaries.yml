name: Sync upstream dictionaries

on:
  schedule:
    # Weekly on Monday at 04:17 UTC; off the top of the hour to reduce delays.
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: sync-upstream-dictionaries
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  PYTHONNOUSERSITE: "1"
  BASE_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-pixi

      - name: Restore upstream Git cache
        uses: actions/cache@v6
        with:
          path: .tmp/upstream-git-cache
          key: upstream-git-${{ runner.os }}-${{ hashFiles('tools/upstream_dictionaries.lock.json') }}
          restore-keys: |
            upstream-git-${{ runner.os }}-

      - name: Detect and integrate upstream changes
        shell: pwsh
        run: |
          $Python = (pixi run python -c "import sys; print(sys.executable)").Trim()
          ./tools/update_upstream_dictionaries.ps1 -Python $Python -CacheDirectory .tmp/upstream-git-cache

      - name: Detect generated changes
        id: changes
        shell: pwsh
        run: |
          $Changed = git status --porcelain -- `
            VERSION `
            *.yaml `
            dicts/eosphoros `
            opencc/eosphoros/eosphoros_emoji_extra_chars.lua `
            opencc/eosphoros/eosphoros_emoji_extra_phrases_index.lua `
            opencc/eosphoros/eosphoros_emoji_extra_phrases_0.lua `
            tools/upstream_dictionaries.lock.json
          if ($Changed) {
            "changed=true" >> $env:GITHUB_OUTPUT
          }
          else {
            "changed=false" >> $env:GITHUB_OUTPUT
          }

      - name: Validate generated dictionaries
        if: steps.changes.outputs.changed == 'true'
        run: |
          pixi run check
          pixi run lua tests/run.lua
          git diff --check

      - name: Commit and open pull request
        if: steps.changes.outputs.changed == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Branch = "automation/upstream-dictionaries-$env:GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c $Branch
          git add -- `
            VERSION `
            *.yaml `
            dicts/eosphoros `
            opencc/eosphoros/eosphoros_emoji_extra_chars.lua `
            opencc/eosphoros/eosphoros_emoji_extra_phrases_index.lua `
            opencc/eosphoros/eosphoros_emoji_extra_phrases_0.lua `
            tools/upstream_dictionaries.lock.json
          git commit -m "chore: update upstream dictionaries"
          git push origin "HEAD:refs/heads/$Branch"
          gh pr create `
            --base $env:BASE_BRANCH `
            --head $Branch `
            --title "chore: update upstream dictionaries" `
            --body "Automated rebuild from newly detected upstream dictionary commits. The pinned hashes, generated checksums, deduplication, JianDao 6 priority assignment, and collision-rate cap have all been refreshed and validated."
