name: Sync upstream dictionaries

on:
  schedule:
    # Weekly on Monday at 04:17 UTC; off the top of the hour to reduce delays.
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: sync-upstream-dictionaries
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  PYTHONNOUSERSITE: "1"
  BASE_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-pixi

      - name: Restore upstream Git cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .tmp/upstream-git-cache
          key: upstream-git-${{ runner.os }}-${{ hashFiles('tools/upstream_dictionaries.lock.json') }}
          restore-keys: |
            upstream-git-${{ runner.os }}-

      - name: Detect and integrate upstream changes
        shell: pwsh
        run: |
          $Python = (pixi run python -c "import sys; print(sys.executable)").Trim()
          ./tools/update_upstream_dictionaries.ps1 -Python $Python -CacheDirectory .tmp/upstream-git-cache

      - name: Detect generated changes
        id: changes
        shell: pwsh
        run: |
          $Changed = git status --porcelain -- `
            VERSION `
            *.yaml `
            dicts/eosphoros `
            fcitx5 `
            mobile_themes `
            README.md `
            opencc/eosphoros/eosphoros_emoji_extra_chars.lua `
            opencc/eosphoros/eosphoros_emoji_extra_phrases_index.lua `
            opencc/eosphoros/eosphoros_emoji_extra_phrases_0.lua `
            tools/upstream_dictionaries.lock.json
          if ($Changed) {
            "changed=true" >> $env:GITHUB_OUTPUT
          }
          else {
            "changed=false" >> $env:GITHUB_OUTPUT
          }

      - name: Validate generated dictionaries
        if: steps.changes.outputs.changed == 'true'
        run: |
          pixi run check
          pixi run lua tests/run.lua
          git diff --check

      - name: Publish validated changes
        if: steps.changes.outputs.changed == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOMATION_AUTO_MERGE: ${{ vars.AUTOMATION_AUTO_MERGE }}
        run: |
          ./tools/publish_automation_pr.ps1 `
            -Branch "automation/upstream-dictionaries" `
            -Title "chore: update upstream dictionaries" `
            -Body "Automated rebuild from newly detected upstream dictionary commits. The pinned hashes, generated checksums, deduplication, JianDao 6 priority assignment, and collision-rate cap have all been refreshed, and pixi run check passed on this commit." `
            -Paths "VERSION","*.yaml","dicts/eosphoros","fcitx5","mobile_themes","README.md","opencc/eosphoros/eosphoros_emoji_extra_chars.lua","opencc/eosphoros/eosphoros_emoji_extra_phrases_index.lua","opencc/eosphoros/eosphoros_emoji_extra_phrases_0.lua","tools/upstream_dictionaries.lock.json"
