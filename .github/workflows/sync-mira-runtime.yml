name: Sync Mira runtime

on:
  schedule:
    # Weekly on Monday at 04:47 UTC, after the upstream dictionary sync.
    - cron: "47 4 * * 1"
  workflow_dispatch:

concurrency:
  group: sync-mira-runtime
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  PYTHONNOUSERSITE: "1"
  BASE_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          check-latest: true

      - name: Download latest Mira binaries and refresh pinned checksums
        run: python tools/update_mira_checksums.py --write

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet -- tools/mira_runtime.lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rime Prelude for the isolated test workspace
        if: steps.changes.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y rime-prelude
          cp --update=none /usr/share/rime-data/*.yaml .

      - name: Test real input behavior with the new binaries
        if: steps.changes.outputs.changed == 'true'
        run: |
          for binary in .tmp/mira/*; do
            echo "::group::$(basename "$binary")"
            "$binary" -C ".tmp/mira-cache-$(basename "$binary")" tests/eosphoros.mira.test.yaml
            echo "::endgroup::"
          done

      - name: Commit and open pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="automation/mira-runtime-$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -- tools/mira_runtime.lock.json
          git commit -m "ci: refresh pinned Mira runtime checksums"
          git push origin "HEAD:refs/heads/$branch"
          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$branch" \
            --title "ci: refresh pinned Mira runtime checksums" \
            --body "rimeinn/mira re-published its rolling latest release. This updates the pinned SHA-256 values in tools/mira_runtime.lock.json. Both new binaries passed tests/eosphoros.mira.test.yaml in this workflow run; review the run before merging."
