name: Check reference upstreams

on:
  schedule:
    - cron: "23 5 * * 1"
    - cron: "27 5 2 * *"
  workflow_dispatch:

concurrency:
  group: check-reference-upstreams
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  PYTHONNOUSERSITE: "1"

jobs:
  legacy:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '23 5 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          check-latest: true

      - name: Compare with the last reviewed upstream commit
        id: upstream
        shell: pwsh
        run: |
          python tools/check_xmjd6_upstream.py --json > xmjd6-upstream-report.json
          $Report = Get-Content xmjd6-upstream-report.json -Raw -Encoding utf8 | ConvertFrom-Json
          "update=$($Report.update_available.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "reviewed=$($Report.reviewed_commit)" >> $env:GITHUB_OUTPUT
          "current=$($Report.current_commit)" >> $env:GITHUB_OUTPUT
          "compare=$($Report.compare_url)" >> $env:GITHUB_OUTPUT

      - name: Publish summary
        shell: pwsh
        run: |
          $Report = Get-Content xmjd6-upstream-report.json -Raw -Encoding utf8 | ConvertFrom-Json
          @"
          ## xmjd6-rere upstream review

          - Last reviewed: ``$($Report.reviewed_commit)``
          - Current: ``$($Report.current_commit)``
          - Update available: ``$($Report.update_available)``
          - [Compare commits]($($Report.compare_url))

          Changes require selective review plus local deduplication and collision checks; this workflow never overwrites the renamed Eosphoros files.
          "@ | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Open or update review issue
        if: steps.upstream.outputs.update == 'true'
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          script: |
            const title = 'xmjd6-rere 上游有新提交待审校';
            const body = [
              `- 已审校：\`${{ steps.upstream.outputs.reviewed }}\``,
              `- 当前上游：\`${{ steps.upstream.outputs.current }}\``,
              `- [查看增量](${{ steps.upstream.outputs.compare }})`,
              '',
              '请逐条审校。不要整体覆盖词库、Lua、Schema、目录名或 Release 配置；择取词条后必须运行全库去重、合法编码和重码检查。',
            ].join('\n');
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.data.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

  christian-sources:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '27 5 2 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          check-latest: true

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .tmp/christian_source_status.json
          key: christian-sources-${{ runner.os }}-${{ hashFiles('tools/christian_traditions_sources.md') }}
          restore-keys: christian-sources-${{ runner.os }}-

      - name: Validate registry and check source metadata
        run: python tools/check_christian_sources.py --check --online
