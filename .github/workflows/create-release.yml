name: Create Release with Zipped Branch Assets and Date

on:
  schedule:
    - cron: "17 4 1,15 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify every asset without publishing a GitHub Release
        required: false
        default: false
        type: boolean

concurrency:
  group: create-release
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  PYTHONNOUSERSITE: "1"
  OPENCC_TONGGUI_URL: https://github.com/amorphobia/opencc-tonggui/releases/download/latest/opencc-tonggui.zip
  OPENCC_TONGGUI_SHA256: 1b76a1028669b89d55a9055400e8be628014ea6f3b200b34b5e8a7d88f04e018
  YONG_WIN_URL: https://github.com/hugh7007/xmjd6-rere/releases/download/20231115/yong-win.7z
  YONG_LINUX_URL: https://github.com/hugh7007/xmjd6-rere/releases/download/20231115/yong-lin.7z
jobs:
  check_release_needed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      should_release: ${{ steps.gate.outputs.should_release }}

    steps:
    - name: Check for commits since the latest Release
      id: gate
      uses: actions/github-script@v9
      with:
        script: |
          if (context.eventName === 'workflow_dispatch') {
            core.info('Manual run requested; Release creation is forced.');
            core.setOutput('should_release', 'true');
            return;
          }

          let shouldRelease = true;
          try {
            const latest = await github.rest.repos.getLatestRelease({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            const compare = await github.rest.repos.compareCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: latest.data.tag_name,
              head: context.sha
            });
            shouldRelease = compare.data.ahead_by > 0;
            core.info(`Commits since ${latest.data.tag_name}: ${compare.data.ahead_by}`);
          } catch (error) {
            if (error.status !== 404) throw error;
            core.warning('No comparable previous Release was found; a Release will be created.');
          }
          core.setOutput('should_release', shouldRelease ? 'true' : 'false');
          if (!shouldRelease) {
            await core.summary
              .addHeading('Release skipped')
              .addRaw('No commits were added after the latest Release.')
              .write();
          }

  build-windows-executables:
    needs: check_release_needed
    if: needs.check_release_needed.outputs.should_release == 'true'
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v7

    - uses: ./.github/actions/setup-pixi

    - name: Verify UTF-8 runtime and Chinese paths
      run: >-
        pixi run python -c "import sys; assert sys.flags.utf8_mode == 1; assert sys.stdout.encoding.lower().replace('-', '') == 'utf8'; assert sys.stderr.encoding.lower().replace('-', '') == 'utf8'; print('UTF-8 中文路径检查：Win_词库合并.exe')"

    - name: Build Windows executables from current Python sources
      run: pixi run python tools/build_zzc_windows_exe.py

    - name: Run rebuilt Windows executable checks
      run: pixi run python -m unittest tests.test_tools.RepositoryValidationTests.test_windows_merge_executable_runs_current_eosphoros_behavior tests.test_tools.RepositoryValidationTests.test_windows_rollback_executable_restores_latest_merge tests.test_tools.RepositoryValidationTests.test_committed_windows_executables_match_sources_and_lock -v

    - name: Upload rebuilt Windows executables
      uses: actions/upload-artifact@v7
      with:
        name: zzc-windows-executables
        path: |
          zzc/Win_词库合并.exe
          zzc/Win_撤回合并.exe
        if-no-files-found: error
        retention-days: 1

  validate-source:
    needs: check_release_needed
    if: needs.check_release_needed.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7

    - uses: ./.github/actions/setup-pixi

    - name: Validate release source tree
      run: |
        pixi run check
        pixi run lua tests/run.lua
        git diff --check

  build-native-release:
    needs:
      - check_release_needed
      - build-windows-executables
    if: needs.check_release_needed.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7

    - uses: ./.github/actions/setup-pixi

    - name: Install native compilers
      run: |
        sudo apt-get update
        sudo apt-get install -y librime-bin librime-plugin-lua rime-prelude \
          libime-bin

    - name: Use Windows executables rebuilt by CI
      uses: actions/download-artifact@v8
      with:
        name: zzc-windows-executables
        path: zzc

    - name: Create directories
      run: |
        mkdir -p Rime

    - uses: ./.github/actions/fetch-opencc
      with:
        url: ${{ env.OPENCC_TONGGUI_URL }}
        sha256: ${{ env.OPENCC_TONGGUI_SHA256 }}

    - name: Build Fcitx5 packages and compile Rime core in parallel
      run: |
        pixi run python tools/build_fcitx5_table.py \
          --compiler "$(command -v libime_tabledict)" &
        fcitx_pid=$!
        pixi run python tools/smoke_test_rime_deployment.py \
          --shared-data-dir /usr/share/rime-data &
        rime_pid=$!
        status=0
        wait "$fcitx_pid" || status=$?
        wait "$rime_pid" || status=$?
        exit "$status"

    - name: Build generic and platform-specific Rime packages
      run: pixi run python tools/build_platform_packages.py

    - name: Embed native mobile themes in platform packages
      run: pixi run python tools/build_mobile_themes.py --platform-dir .

    - name: Upload native release assets
      uses: actions/upload-artifact@v7
      with:
        name: release-native-assets
        path: |
          eosphoros-rime-full.zip
          eosphoros-rime-standard.zip
          eosphoros-rime-lite.zip
          eosphoros-weasel-windows-rime.zip
          eosphoros-squirrel-macos-rime.zip
          eosphoros-fcitx5-macos.zip
          eosphoros-fcitx5-linux.zip
          eosphoros-fcitx5-macos-rime.zip
          eosphoros-fcitx5-linux-rime.zip
          eosphoros-trime-android.zip
          eosphoros-fcitx5-android.zip
          eosphoros-fcitx5-android-rime.zip
          eosphoros-yuanshu-ios-rime.zip
          eosphoros-hamster-ios-rime.zip
        if-no-files-found: error
        retention-days: 1
        compression-level: 0

  build-rabbit-release:
    needs:
      - check_release_needed
      - build-windows-executables
    if: needs.check_release_needed.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7

    - uses: ./.github/actions/setup-pixi

    - name: Use Windows executables rebuilt by CI
      uses: actions/download-artifact@v8
      with:
        name: zzc-windows-executables
        path: zzc

    - uses: ./.github/actions/fetch-opencc
      with:
        url: ${{ env.OPENCC_TONGGUI_URL }}
        sha256: ${{ env.OPENCC_TONGGUI_SHA256 }}

    - name: Resolve latest Rabbit x64 release
      id: rabbit
      uses: actions/github-script@v9
      with:
        script: |
          const release = await github.rest.repos.getLatestRelease({
            owner: 'rimeinn',
            repo: 'rabbit'
          });
          const tag = release.data.tag_name;
          const assetName = `rabbit-${tag}-x64.zip`;
          const asset = release.data.assets.find(candidate => candidate.name === assetName);
          if (!asset) {
            core.setFailed(`Latest Rabbit release ${tag} has no ${assetName} asset.`);
            return;
          }
          const digest = asset.digest || '';
          if (!/^sha256:[0-9a-f]{64}$/i.test(digest)) {
            core.setFailed(`${assetName} has no valid SHA256 digest.`);
            return;
          }
          core.info(`Using Rabbit ${tag}: ${asset.browser_download_url}`);
          core.setOutput('url', asset.browser_download_url);
          core.setOutput('sha256', digest.substring('sha256:'.length));

    - name: Download verified latest Rabbit release asset
      env:
        RABBIT_URL: ${{ steps.rabbit.outputs.url }}
        RABBIT_SHA256: ${{ steps.rabbit.outputs.sha256 }}
      run: |
        curl --retry 3 --retry-all-errors --fail --location --output rabbit.zip "$RABBIT_URL"
        echo "$RABBIT_SHA256  rabbit.zip" | sha256sum --check --strict

    - name: Unzip Rabbit
      run: |
        mkdir -p Rabbit
        unzip rabbit.zip -d Rabbit

    - name: Prepare minimal Rabbit bundle
      run: |
        pixi run python tools/prepare_rabbit_release.py --rabbit-dir Rabbit
        zip -r eosphoros-rabbit-windows-rime.zip Rabbit/

    - name: Upload Rabbit release asset
      uses: actions/upload-artifact@v7
      with:
        name: release-rabbit-assets
        path: eosphoros-rabbit-windows-rime.zip
        if-no-files-found: error
        retention-days: 1
        compression-level: 0

  build-yong-release:
    needs:
      - check_release_needed
    if: needs.check_release_needed.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7

    - uses: ./.github/actions/setup-pixi

    - name: Build deterministic Yong table and dazhu index
      run: |
        mkdir -p mb/eosphoros
        pixi run python tools/build_yong_table.py \
          --table mb/eosphoros/eosphoros.txt \
          --dazhu dazhu.txt

    - name: Zip yong
      run: |
        pixi run python tools/build_eosphoros_icons.py --check
        mkdir -p yong_android/yong/.yong
        pixi run python -c "from pathlib import Path; source = Path('packaging/yong/android/yong.ini').read_text(encoding='utf-8'); Path('yong_android/yong/.yong/yong.ini').write_text(source, encoding='utf-8-sig', newline='\n')"
        cp -r mb yong_android/yong/.yong/
        cp packaging/yong/android/README.txt yong_android/yong/README-Eosphoros-Android.txt
        mkdir -p yong_android/yong/.yong/android
        pixi run python tools/build_yong_android_skin.py packaging/yong/android/skin --theme dawn --output yong_android/yong/.yong/android/Eosphoros-Dawn.zip
        pixi run python tools/build_yong_android_skin.py packaging/yong/android/skin --theme night --output yong_android/yong/.yong/android/Eosphoros-Night.zip
        pixi run python tools/validate_yong_package.py yong_android/yong
        cd yong_android
        zip -r ../eosphoros-yong-android.zip yong
        cd ..
        rm -rf yong_android

        mkdir -p .yong
        curl --fail --location --output yong-win.7z "$YONG_WIN_URL"
        curl --fail --location --output yong-lin.7z "$YONG_LINUX_URL"
        pixi run python -c "from pathlib import Path; source = Path('packaging/yong/yong.ini').read_text(encoding='utf-8'); Path('.yong/yong.ini').write_text(source, encoding='utf-8-sig', newline='\n')"
        cp -r mb .yong/

        7z x yong-lin.7z -oyong_linux_temp
        mkdir -p yong_linux_temp/yong/.yong
        cp .yong/yong.ini yong_linux_temp/yong/.yong/yong.ini
        cp .yong/yong.ini yong_linux_temp/yong/yong.ini
        cp -r mb yong_linux_temp/yong/
        pixi run python tools/prepare_yong_desktop_skins.py --base-skin yong_linux_temp/yong/skin --destination yong_linux_temp/yong/skin
        cp packaging/yong/linux/README.txt yong_linux_temp/yong/README-Eosphoros-Linux.txt
        pixi run python tools/validate_yong_package.py yong_linux_temp/yong
        (cd yong_linux_temp && zip -r ../eosphoros-yong-linux.zip yong)
        rm -rf yong_linux_temp

        7z x yong-win.7z -oyong_temp
        cp -r .yong yong_temp/yong
        pixi run python tools/prepare_yong_desktop_skins.py --base-skin yong_temp/yong/skin --destination yong_temp/yong/.yong/skin
        cp packaging/yong/README.txt yong_temp/yong/README-Eosphoros.txt
        pixi run python tools/validate_yong_package.py yong_temp/yong
        (cd yong_temp && zip -r ../eosphoros-yong-windows.zip yong)

        mkdir -p yong_skin_bundle/skin
        pixi run python tools/prepare_yong_desktop_skins.py --base-skin yong_temp/yong/skin --destination yong_skin_bundle/skin
        cd yong_skin_bundle
        zip -r ../eosphoros-yong-desktop-skins.zip skin
        cd ..
        rm -rf .yong yong_temp yong_skin_bundle

    - name: Upload Yong release assets
      uses: actions/upload-artifact@v7
      with:
        name: release-yong-assets
        path: |
          eosphoros-yong-windows.zip
          eosphoros-yong-linux.zip
          eosphoros-yong-android.zip
          eosphoros-yong-desktop-skins.zip
        if-no-files-found: error
        retention-days: 1
        compression-level: 0

    - name: Upload compressed Yong index
      uses: actions/upload-artifact@v7
      with:
        name: release-yong-index-assets
        path: dazhu.txt
        if-no-files-found: error
        retention-days: 1

  release:
    needs:
      - check_release_needed
      - validate-source
      - build-native-release
      - build-rabbit-release
      - build-yong-release
    if: needs.check_release_needed.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
    - name: Set up unique release metadata
      run: |
        echo "RELEASE_TAG=$(date +'%Y%m%d')-r${GITHUB_RUN_NUMBER}-a${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
        echo "RELEASE_TITLE=$(date +'%Y.%m.%d') 词库更新 #${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

    - name: Download all release assets
      uses: actions/download-artifact@v8
      with:
        pattern: release-*-assets
        merge-multiple: true

    - name: Generate changelog from last release
      id: changelog
      uses: actions/github-script@v9
      with:
        script: |
          let changelog = '';
          const renderCommit = commit => {
            const message = commit.commit.message.split('\n').join(' ');
            const commitLink = `[${commit.sha.substring(0, 7)}](https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${commit.sha})`;
            return `- ${commitLink} ${message} \n`;
          };
          try {
            const lastRelease = await github.rest.repos.getLatestRelease({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            const compare = await github.rest.repos.compareCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: lastRelease.data.tag_name,
              head: context.sha
            });
            changelog = compare.data.commits.map(renderCommit).join('');
          } catch (error) {
            if (error.status !== 404) throw error;
            core.warning('Previous release tag is unavailable; changelog will contain the current commit only.');
            const current = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha
            });
            changelog = renderCommit(current.data);
          }
          core.setOutput('changelog', changelog);

    - name: Create release asset manifest and checksums
      run: |
        assets=(
          eosphoros-rabbit-windows-rime.zip
          eosphoros-yong-windows.zip
          eosphoros-yong-linux.zip
          eosphoros-yong-android.zip
          eosphoros-yong-desktop-skins.zip
          eosphoros-rime-full.zip
          eosphoros-rime-standard.zip
          eosphoros-rime-lite.zip
          eosphoros-weasel-windows-rime.zip
          eosphoros-squirrel-macos-rime.zip
          eosphoros-fcitx5-macos.zip
          eosphoros-fcitx5-linux.zip
          eosphoros-fcitx5-macos-rime.zip
          eosphoros-fcitx5-linux-rime.zip
          eosphoros-trime-android.zip
          eosphoros-fcitx5-android.zip
          eosphoros-fcitx5-android-rime.zip
          eosphoros-yuanshu-ios-rime.zip
          eosphoros-hamster-ios-rime.zip
          dazhu.txt
        )
        printf '%s\n' "${assets[@]}" > release-assets.txt
        sha256sum "${assets[@]}" > SHA256SUMS

    - name: Upload dry-run release bundle
      if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
      uses: actions/upload-artifact@v7
      with:
        name: release-dry-run-${{ github.run_number }}-${{ github.run_attempt }}
        path: |
          eosphoros-*.zip
          dazhu.txt
          SHA256SUMS
          release-assets.txt
        if-no-files-found: error
        retention-days: 7

    - name: Publish unique Release
      if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_NOTES: |
          ## 平台与词库版本

          | 平台 | 输入法 / 引擎 | 下载文件 | 词库档位 |
          | --- | --- | --- | --- |
          | 通用 | Rime（需 librime-lua） | `eosphoros-rime-full.zip` | 完整版 |
          | 通用 | Rime（需 librime-lua） | `eosphoros-rime-standard.zip` | 标准版 |
          | 通用 | Rime（需 librime-lua） | `eosphoros-rime-lite.zip` | 精简版 |
          | Windows | 小狼毫 Weasel | `eosphoros-weasel-windows-rime.zip` | 完整版 |
          | Windows | 玉兔毫 Rabbit | `eosphoros-rabbit-windows-rime.zip` | 完整版 |
          | Windows | 小小输入法 Yong | `eosphoros-yong-windows.zip` | 完整版 |
          | macOS | 鼠须管 Squirrel | `eosphoros-squirrel-macos-rime.zip` | 完整版 |
          | macOS | Fcitx5 原生 Table | `eosphoros-fcitx5-macos.zip` | 完整版 |
          | macOS | Fcitx5 + Rime 插件 | `eosphoros-fcitx5-macos-rime.zip` | 完整版 |
          | Linux | Fcitx5 原生 Table | `eosphoros-fcitx5-linux.zip` | 完整版 |
          | Linux | Fcitx5 + Rime 插件 | `eosphoros-fcitx5-linux-rime.zip` | 完整版 |
          | Linux | 小小输入法 Yong | `eosphoros-yong-linux.zip` | 完整版 |
          | Android | 同文 Trime | `eosphoros-trime-android.zip` | 完整版 |
          | Android | Fcitx5 原生 Table | `eosphoros-fcitx5-android.zip` | 完整版 |
          | Android | Fcitx5 + Rime 插件 | `eosphoros-fcitx5-android-rime.zip` | 完整版 |
          | Android | 小小输入法 Yong | `eosphoros-yong-android.zip` | 完整版 |
          | iOS | 元书输入法 | `eosphoros-yuanshu-ios-rime.zip` | 完整版 |
          | iOS | 仓输入法 Hamster | `eosphoros-hamster-ios-rime.zip` | 完整版 |

          ## Changelog
          ${{ steps.changelog.outputs.changelog }}

          ## Release Notes
          - [如何使用](${{ github.server_url }}/${{ github.repository }}#如何使用)
          - 构建：[${{ github.run_number }}.${{ github.run_attempt }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
      run: |
        mapfile -t assets < release-assets.txt
        assets+=(SHA256SUMS)
        printf '%s\n' "$RELEASE_NOTES" > release-notes.md
        gh release create "$RELEASE_TAG" "${assets[@]}" \
          --target "$GITHUB_SHA" \
          --title "$RELEASE_TITLE" \
          --notes-file release-notes.md
