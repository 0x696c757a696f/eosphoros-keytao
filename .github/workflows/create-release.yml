name: Create Release with Zipped Branch Assets and Date

on:
  schedule:
    - cron: "17 4 1,15 * *"
  workflow_dispatch:

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  PYTHONNOUSERSITE: "1"
  OPENCC_TONGGUI_URL: https://github.com/amorphobia/opencc-tonggui/releases/download/latest/opencc-tonggui.zip
  OPENCC_TONGGUI_SHA256: 1b76a1028669b89d55a9055400e8be628014ea6f3b200b34b5e8a7d88f04e018
  YONG_WIN_URL: https://github.com/hugh7007/xmjd6-rere/releases/download/20231115/yong-win.7z
  YONG_LINUX_URL: https://github.com/hugh7007/xmjd6-rere/releases/download/20231115/yong-lin.7z
  RABBIT_TAG: v0.4.0
  RABBIT_URL: https://github.com/rimeinn/rabbit/releases/download/v0.4.0/rabbit-v0.4.0-x64.zip
  RABBIT_SHA256: 33a66a9a87845ea0eb78d552a8002c4a49902575f62422327032b29c4115a6ad

jobs:
  check_release_needed:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_release: ${{ steps.gate.outputs.should_release }}

    steps:
    - name: Check for commits since the latest Release
      id: gate
      uses: actions/github-script@v9
      with:
        script: |
          if (context.eventName === 'workflow_dispatch') {
            core.info('Manual run requested; Release creation is forced.');
            core.setOutput('should_release', 'true');
            return;
          }

          let shouldRelease = true;
          try {
            const latest = await github.rest.repos.getLatestRelease({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            const compare = await github.rest.repos.compareCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: latest.data.tag_name,
              head: context.sha
            });
            shouldRelease = compare.data.ahead_by > 0;
            core.info(`Commits since ${latest.data.tag_name}: ${compare.data.ahead_by}`);
          } catch (error) {
            if (error.status !== 404) throw error;
            core.warning('No comparable previous Release was found; a Release will be created.');
          }
          core.setOutput('should_release', shouldRelease ? 'true' : 'false');
          if (!shouldRelease) {
            await core.summary
              .addHeading('Release skipped')
              .addRaw('No commits were added after the latest Release.')
              .write();
          }

  build-windows-executables:
    needs: check_release_needed
    if: needs.check_release_needed.outputs.should_release == 'true'
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        python-version: '3.14'
        check-latest: true

    - name: Verify UTF-8 runtime and Chinese paths
      run: >-
        python -c "import sys; assert sys.flags.utf8_mode == 1; assert sys.stdout.encoding.lower().replace('-', '') == 'utf8'; assert sys.stderr.encoding.lower().replace('-', '') == 'utf8'; print('UTF-8 中文路径检查：Win_词库合并.exe')"

    - name: Install test dependencies and pinned executable builder
      run: |
        python -m pip install --upgrade -r requirements-ci.txt
        python -m pip install -r requirements-build.txt

    - name: Build Windows executables from current Python sources
      run: python tools/build_zzc_windows_exe.py

    - name: Run rebuilt Windows executable checks
      run: python -m unittest tests.test_tools.RepositoryValidationTests.test_windows_merge_executable_runs_current_eosphoros_behavior tests.test_tools.RepositoryValidationTests.test_windows_rollback_executable_restores_latest_merge tests.test_tools.RepositoryValidationTests.test_committed_windows_executables_match_sources_and_lock -v

    - name: Upload rebuilt Windows executables
      uses: actions/upload-artifact@v7
      with:
        name: zzc-windows-executables
        path: |
          zzc/Win_词库合并.exe
          zzc/Win_撤回合并.exe
        if-no-files-found: error
        retention-days: 1

  release:
    needs:
      - check_release_needed
      - build-windows-executables
    if: needs.check_release_needed.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Set up environment variables
      run: |
        echo "CURRENT_DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV
        echo "RELEASE_TITLE=$(date +'%Y.%m.%d') 词库更新" >> $GITHUB_ENV

    - name: Checkout master branch
      uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        python-version: '3.14'
        check-latest: true

    - uses: prefix-dev/setup-pixi@v0.10.0
      with:
        cache: true
        run-install: true

    - name: Validate source tree
      run: |
        sudo apt-get update
        sudo apt-get install -y lua5.4 librime-bin librime-plugin-lua rime-prelude
        python -m pip install --upgrade -r requirements-ci.txt
        python -m pip install -r requirements-dev.txt
        python tools/validate_repo.py
        python tools/audit_long_dictionary_entries.py --check
        lua5.4 tests/run.lua
        pixi run python -m unittest discover -s tests -p 'test_*.py' -v

    - name: Use Windows executables rebuilt by CI
      uses: actions/download-artifact@v8
      with:
        name: zzc-windows-executables
        path: zzc

    - name: Create directories
      run: |
        mkdir -p Rime
        mkdir -p mb/eosphoros

    - name: Download verified OpenCC data
      run: |
        python tools/fetch_opencc.py \
          --url "$OPENCC_TONGGUI_URL" \
          --sha256 "$OPENCC_TONGGUI_SHA256" \
          --destination opencc/eosphoros

    - name: Build generic and platform-specific Rime packages
      run: python tools/build_platform_packages.py

    - name: Compile packaged core with librime and Lua
      run: python tools/smoke_test_rime_deployment.py --shared-data-dir /usr/share/rime-data

    - name: Validate embedded Fcitx5 themes
      run: python tools/build_fcitx5_themes.py --check

    - name: Embed native mobile themes in platform packages
      run: |
        pixi run python tools/build_mobile_themes.py --check
        pixi run python tools/build_mobile_themes.py --platform-dir .

    - name: Prepare Rime directory for Rabbit
      run: |
        mkdir -p Rime/
        rsync -avm --exclude='.git*' --exclude='*.github*' --exclude='/fcitx5/' --exclude='squirrel*' --exclude='weasel*' --exclude='hamster*' --exclude='*.txt' --exclude='*.zip' --exclude='yong*' --exclude='mb*' --exclude='Rime*' --exclude='/tests/' --exclude='/tools/' --exclude='/VERSION' --exclude='/requirements*.txt' . Rime/
        ls -al Rime/
        pwd

    - name: Fetch tags and generate changelog from last release
      id: changelog
      uses: actions/github-script@v9
      with:
        script: |
          let changelog = '';
          const renderCommit = commit => {
            const message = commit.commit.message.split('\n').join(' ');
            const commitLink = `[${commit.sha.substring(0, 7)}](https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${commit.sha})`;
            return `- ${commitLink} ${message} \n`;
          };
          try {
            const lastRelease = await github.rest.repos.getLatestRelease({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            const compare = await github.rest.repos.compareCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: lastRelease.data.tag_name,
              head: context.sha
            });
            changelog = compare.data.commits.map(renderCommit).join('');
          } catch (error) {
            if (error.status !== 404) throw error;
            core.warning('Previous release tag is unavailable; changelog will contain the current commit only.');
            const current = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha
            });
            changelog = renderCommit(current.data);
          }
          core.setOutput('changelog', changelog);

    - name: Download verified Rabbit release asset
      run: |
        curl --fail --location --output "rabbit-$RABBIT_TAG.zip" "$RABBIT_URL"
        echo "$RABBIT_SHA256  rabbit-$RABBIT_TAG.zip" | sha256sum --check --strict

    - name: Unzip Rabbit
      run: |
        mkdir -p Rabbit
        unzip "rabbit-$RABBIT_TAG.zip" -d Rabbit

    - name: Clean Data
      run: |
        mkdir -p /tmp/Rabbit_backup
        cp Rabbit/Data/punctuation.yaml /tmp/Rabbit_backup/
        cp Rabbit/Data/key_bindings.yaml /tmp/Rabbit_backup/
        cp Rabbit/Data/default.yaml /tmp/Rabbit_backup/
        cp Rabbit/Data/symbols.yaml /tmp/Rabbit_backup/
        cp Rabbit/Data/rabbit.yaml /tmp/Rabbit_backup/
        cp Rime/default.custom.yaml Rabbit/Rime
        mkdir -p Rabbit/Rime/dicts/eosphoros
        cp Rime/dicts/eosphoros/eosphoros.user.dict.yaml Rabbit/Rime/dicts/eosphoros
        cp Rime/eosphoros.custom.yaml Rabbit/Rime
        rm -rf Rabbit/Data/*
        rm -f Rime/default.custom.yaml
        rm -f Rime/dicts/eosphoros/eosphoros.user.dict.yaml
        rm -f Rime/eosphoros.custom.yaml
        cp /tmp/Rabbit_backup/* Rabbit/Data/
        rm -rf /tmp/Rabbit_backup

    - name: Merge Rime into Rabbit
      run: |
        cp -r Rime/. Rabbit/Data
        zip -r Rabbit-eosphoros.zip Rabbit/

    - name: Convert .dict.yaml files to .txt using Bash
      run: |
        for dict_file in dicts/eosphoros/eosphoros.core.dict.yaml dicts/eosphoros/eosphoros.danzi.dict.yaml dicts/eosphoros/eosphoros.catholicism.dict.yaml dicts/eosphoros/eosphoros.protestantism.dict.yaml dicts/eosphoros/eosphoros.orthodoxy.dict.yaml dicts/eosphoros/eosphoros.oriental.dict.yaml dicts/eosphoros/eosphoros.assyrian.dict.yaml dicts/eosphoros/eosphoros.cizu.dict.yaml dicts/eosphoros/eosphoros.fjcy.dict.yaml dicts/eosphoros/eosphoros.ice.dict.yaml dicts/eosphoros/eosphoros.wanxiang.*.dict.yaml dicts/eosphoros/eosphoros.en.dict.yaml
        do
          base=$(basename "$dict_file")
          if [[ "$base" == *.dict.yaml ]]; then
            txt_name="${base%.dict.yaml}.txt"
          else
            txt_name="${base%.yaml}.txt"
          fi
          txt_file="Rime/$txt_name"
          awk -F'\t' '
          /^[^#]/ {
            if ($0 ~ /^---|name:|version:|sort:|\.\.\.$/) next;
            if (FILENAME ~ /eosphoros[.]en[.]dict[.]yaml$/) {
              print $2 " " $1
            } else if ($1 ~ /^[A-Za-z0-9\s]+$/) {
              print $1 " " $2
            } else {
              print $2 " " $1
            }
          }' "$dict_file" > "$txt_file"
        done

    - name: Merge .txt files in specific order, add header
      run: |
        # 创建头文件
        header='name=晨星键道\nkey=`abcedfghijklmnopqrstuvwxyz;\\\nlen=12\nwildcard=~\nbihua=viuoa\ncode_e2=p11+p12+p21+p22+p13+p23\ncode_e3=p11+p21+p31+p13+p23+p33\ncode_a4=p11+p21+p31+n11+p13+p23+p33\n[DATA]'
        echo -e "$header" > Rime/eosphoros.header.txt

        # 按照指定顺序合并 .txt 文件
        cat Rime/eosphoros.danzi.txt \
            Rime/eosphoros.cizu.txt \
            Rime/eosphoros.catholicism.txt \
            Rime/eosphoros.protestantism.txt \
            Rime/eosphoros.orthodoxy.txt \
            Rime/eosphoros.oriental.txt \
            Rime/eosphoros.assyrian.txt \
            Rime/eosphoros.core.txt \
            Rime/eosphoros.fjcy.txt \
            Rime/eosphoros.ice.txt \
            Rime/eosphoros.wanxiang.yaopin.txt \
            Rime/eosphoros.wanxiang.yixue.txt \
            Rime/eosphoros.wanxiang.huaxue.txt \
            Rime/eosphoros.wanxiang.diming.txt \
            Rime/eosphoros.wanxiang.mingren.txt \
            Rime/eosphoros.wanxiang.taifeng.txt \
            Rime/eosphoros.wanxiang.jichu.txt \
            Rime/eosphoros.en.txt > Rime/eosphoros.body.txt

        # 将头文件和主体文件合并到一个中间文件
        cat Rime/eosphoros.header.txt Rime/eosphoros.body.txt > mb/eosphoros/tmp_eosphoros.txt

        # 将中间文件移动到最终位置
        mv mb/eosphoros/tmp_eosphoros.txt mb/eosphoros/eosphoros.txt
    - name: Generate dazhu.txt from eosphoros.body.txt，and clean up
      run: |
        # 1. 检查输入文件
        if [ ! -f Rime/eosphoros.body.txt ]; then
          echo "Error: Rime/eosphoros.body.txt not found. Cannot proceed."
          exit 1
        fi

        # 2. 对文件进行排序 (稳定排序)
        #    -k1,1 按第一列 (编码) 排序
        #    -s (--stable) **关键修正：** 保持相同键的原始相对顺序
        sort -k1,1 -s Rime/eosphoros.body.txt > /tmp/sorted_body.txt

        # 3. AWK 脚本 (保持不变，它会忠实地执行 sorted_body.txt 的顺序)
        awk '
        BEGIN {
            OFS = "\t";      # 输出分隔符为制表符
            prev_code = "";  # 跟踪上一个编码
            buffer = "";     # 缓存归并的词语
        }
        {
            # $1 是编码, 获取词语部分（从第一个空格后开始）
            code = $1;
            word = substr($0, length($1) + 2);

            if (word == "") { next; }

            if (code != prev_code && prev_code != "") {
                print prev_code, buffer;
                buffer = "";
            }

            if (buffer == "") {
                buffer = word;
            } else {
                buffer = buffer OFS word;
            }

            prev_code = code;
        }
        END {
            if (prev_code != "") {
                print prev_code, buffer;
            }
        }
        ' /tmp/sorted_body.txt > dazhu.txt

        # 4. 检查文件并清理
        ls -al dazhu.txt
        rm /tmp/sorted_body.txt Rime/eosphoros.header.txt Rime/eosphoros.body.txt

        # 5. 编码转换 (保持不变)
        python -c "with open('mb/eosphoros/eosphoros.txt', 'r', encoding='utf-8') as f: data = f.read(); open('mb/eosphoros/eosphoros.txt', 'w', encoding='gb18030', errors='ignore').write(data)"

    - name: Zip yong
      run: |
        mkdir -p yong_android/yong/.yong
        python -c "from pathlib import Path; source = Path('packaging/yong/android/yong.ini').read_text(encoding='utf-8'); Path('yong_android/yong/.yong/yong.ini').write_text(source, encoding='utf-8-sig', newline='\n')"
        cp -r mb yong_android/yong/.yong/
        cp packaging/yong/android/README.txt yong_android/yong/README-Eosphoros-Android.txt
        mkdir -p yong_android/yong/.yong/android
        python tools/build_yong_android_skin.py packaging/yong/android/skin --theme dawn --output yong_android/yong/.yong/android/Eosphoros-Dawn.zip
        python tools/build_yong_android_skin.py packaging/yong/android/skin --theme night --output yong_android/yong/.yong/android/Eosphoros-Night.zip
        python tools/validate_yong_package.py yong_android/yong
        cd yong_android
        zip -r ../yong-android-eosphoros.zip yong
        cd ..
        rm -rf yong_android

        mkdir -p .yong
        curl --fail --location --output yong-win.7z "$YONG_WIN_URL"
        curl --fail --location --output yong-lin.7z "$YONG_LINUX_URL"
        python -c "from pathlib import Path; source = Path('packaging/yong/yong.ini').read_text(encoding='utf-8'); Path('.yong/yong.ini').write_text(source, encoding='utf-8-sig', newline='\n')"
        cp -r mb .yong/
        mkdir -p .yong/skin
        cp -r packaging/yong/skins/. .yong/skin/

        7z x yong-lin.7z -oyong_linux_temp
        mkdir -p yong_linux_temp/yong/.yong
        cp .yong/yong.ini yong_linux_temp/yong/.yong/yong.ini
        cp .yong/yong.ini yong_linux_temp/yong/yong.ini
        cp -r mb yong_linux_temp/yong/
        mkdir -p yong_linux_temp/yong/skin
        cp -r packaging/yong/skins/. yong_linux_temp/yong/skin/
        cp packaging/yong/linux/README.txt yong_linux_temp/yong/README-Eosphoros-Linux.txt
        python tools/validate_yong_package.py yong_linux_temp/yong
        (cd yong_linux_temp && zip -r ../yong-linux-eosphoros.zip yong)
        rm -rf yong_linux_temp

        7z x yong-win.7z -oyong_temp
        cp -r .yong yong_temp/yong
        cp packaging/yong/README.txt yong_temp/yong/README-Eosphoros.txt
        python tools/validate_yong_package.py yong_temp/yong
        (cd yong_temp && zip -r ../yong-windows-eosphoros.zip yong)
        rm -rf .yong yong_temp

        mkdir -p yong_skin_bundle/skin
        cp -r packaging/yong/skins/. yong_skin_bundle/skin/
        cd yong_skin_bundle
        zip -r ../yong-eosphoros-skins.zip skin
        cd ..
        rm -rf yong_skin_bundle

    - name: Create checksums and publish Release
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_NOTES: |
          ## Changelog
          ${{ steps.changelog.outputs.changelog }}

          ## Release Notes
          - [如何使用](${{ github.server_url }}/${{ github.repository }}#如何使用)
      run: |
        assets=(
          Rabbit-eosphoros.zip
          yong-windows-eosphoros.zip
          yong-linux-eosphoros.zip
          yong-android-eosphoros.zip
          yong-eosphoros-skins.zip
          eosphoros.zip
          eosphoros-weasel.zip
          eosphoros-squirrel.zip
          eosphoros-fcitx5-macos.zip
          eosphoros-fcitx5-linux.zip
          eosphoros-trime.zip
          eosphoros-fcitx5-android.zip
          eosphoros-yuanshu.zip
          eosphoros-hamster.zip
          dazhu.txt
        )
        sha256sum "${assets[@]}" > SHA256SUMS
        assets+=(SHA256SUMS)
        printf '%s\n' "$RELEASE_NOTES" > release-notes.md
        if gh release view "$CURRENT_DATE" >/dev/null 2>&1; then
          gh release upload "$CURRENT_DATE" "${assets[@]}" --clobber
          gh release edit "$CURRENT_DATE" --title "$RELEASE_TITLE" --notes-file release-notes.md
        else
          gh release create "$CURRENT_DATE" "${assets[@]}" \
            --title "$RELEASE_TITLE" \
            --notes-file release-notes.md
        fi
