name: Adapt rime-txjx implementation upstream

on:
  schedule:
    - cron: "47 4 * * 1"
  workflow_dispatch:

concurrency:
  group: adapt-rime-txjx-upstream
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  PYTHONNOUSERSITE: "1"
  BASE_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  adapt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          check-latest: true

      - name: Prepare conflict-safe eosphoros adaptation
        id: adapt
        shell: pwsh
        run: |
          python tools/adapt_txjx_upstream.py --write --update-lock --json > txjx-adaptation-report.json
          $Status = $LASTEXITCODE
          if ($Status -ne 0 -and $Status -ne 20) {
            exit $Status
          }
          $Report = Get-Content txjx-adaptation-report.json -Raw -Encoding utf8 | ConvertFrom-Json
          "status=$Status" >> $env:GITHUB_OUTPUT
          "blocked=$($Report.blocked.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "changed=$(($Report.lock_updated -or $Report.written).ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Install validation dependencies
        if: steps.adapt.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
          python -m pip install --upgrade -r requirements-ci.txt
          python -m pip install -r requirements-dev.txt

      - name: Validate adapted sources
        if: steps.adapt.outputs.changed == 'true'
        run: |
          python tools/validate_repo.py
          python tools/audit_long_dictionary_entries.py --check
          lua5.4 tests/run.lua
          python -m unittest discover -s tests -p "test_*.py" -v
          python tools/build_platform_packages.py --check
          python tools/build_fcitx5_themes.py --check
          python tools/build_mobile_themes.py --check
          git diff --check

      - name: Publish job summary
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path txjx-adaptation-report.json)) { exit 0 }
          $Report = Get-Content txjx-adaptation-report.json -Raw -Encoding utf8 | ConvertFrom-Json
          @"
          ## rime-txjx controlled adaptation

          - Integrated: ``$($Report.base_commit)``
          - Current: ``$($Report.target_commit)``
          - Adapted files: ``$($Report.adapted_targets.Count)``
          - Conflicts: ``$($Report.conflicts.Count)``
          - Critical unmapped files: ``$($Report.critical_unmapped_paths.Count)``
          - Requires Release-only Windows EXE rebuild: ``$($Report.windows_exe_rebuild_required)``
          "@ | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Commit and open adaptation pull request
        if: steps.adapt.outputs.changed == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Report = Get-Content txjx-adaptation-report.json -Raw -Encoding utf8 | ConvertFrom-Json
          $Short = $Report.target_commit.Substring(0, 7)
          $Branch = "automation/rime-txjx-upstream"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $RemoteBranch = git ls-remote --heads origin "refs/heads/$Branch"
          if ($RemoteBranch) {
            git fetch origin "+refs/heads/${Branch}:refs/remotes/origin/${Branch}"
          }
          git switch -c $Branch
          git add -- lua/eosphoros zzc THIRD_PARTY.md tools/upstream_code.lock.json tools/zzc_windows_executables.lock.json
          git commit -m "chore: adapt rime-txjx upstream $Short"
          git push --force-with-lease origin "HEAD:refs/heads/$Branch"
          $Compare = "https://github.com/wzxmer/rime-txjx/compare/$($Report.base_commit)...$($Report.target_commit)"
          $Body = @"
          Controlled three-way adaptation of rime-txjx into the eosphoros namespace.

          - Upstream: ``$($Report.base_commit)`` → ``$($Report.target_commit)``
          - Adapted local files: ``$($Report.adapted_targets.Count)``
          - Informational unmapped files: ``$($Report.unmapped_paths.Count)``
          - Requires Release-only Windows EXE rebuild: ``$($Report.windows_exe_rebuild_required)``
          - [Review upstream commits]($Compare)

          The adapter preserved local eosphoros names and behavior through a three-way merge. Full repository CI must pass before this PR is merged.
          "@
          $Existing = gh pr list --base $env:BASE_BRANCH --head $Branch --state open --json url --jq '.[0].url'
          if ($Existing) {
            gh pr edit $Existing --title "chore: adapt rime-txjx upstream $Short" --body $Body
          } else {
            gh pr create --base $env:BASE_BRANCH --head $Branch --title "chore: adapt rime-txjx upstream $Short" --body $Body
          }

      - name: Open or update manual-review issue
        if: steps.adapt.outputs.blocked == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('txjx-adaptation-report.json', 'utf8'));
            const title = 'rime-txjx 上游适配需要人工处理';
            const compare = `https://github.com/wzxmer/rime-txjx/compare/${report.base_commit}...${report.target_commit}`;
            const details = [
              ...report.conflicts.map(item => `- 冲突：\`${item.source}\` → \`${item.target}\`（${item.reason}）`),
              ...report.critical_unmapped_paths.map(path => `- 未登记的新源码：\`${path}\``),
            ];
            const body = [
              '受控适配器已停止，没有覆盖本地文件，也没有更新锁。',
              '',
              `- 已整合：\`${report.base_commit}\``,
              `- 当前上游：\`${report.target_commit}\``,
              `- [查看上游差异](${compare})`,
              '',
              ...details,
              '',
              '请人工决定冲突行为或为新文件添加明确的 eosphoros 映射；不要直接复制 txjx 文件。',
            ].join('\n');
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = open.data.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
