name: Native Fcitx5

on:
  push:
    paths:
      - "native/fcitx5-eosphoros/**"
      - "eosphoros.schema.yaml"
      - "eosphoros.extended.dict.yaml"
      - "dicts/eosphoros/**"
      - "tests/test_native_fcitx5.py"
      - ".github/workflows/native-fcitx5.yml"
  pull_request:
    paths:
      - "native/fcitx5-eosphoros/**"
      - "eosphoros.schema.yaml"
      - "eosphoros.extended.dict.yaml"
      - "dicts/eosphoros/**"
      - "tests/test_native_fcitx5.py"
      - ".github/workflows/native-fcitx5.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cmake extra-cmake-modules g++ libfcitx5core-dev ninja-build python3

      - name: Configure
        run: >-
          cmake -S native/fcitx5-eosphoros -B build/native-fcitx5 -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build and test
        shell: bash
        run: |
          set +e
          cmake --build build/native-fcitx5 2>&1 | tee build/native-fcitx5/build.log
          build_status=${PIPESTATUS[0]}
          set -e
          if (( build_status != 0 )); then
            details=$(tail -n 35 build/native-fcitx5/build.log | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/$/%0A/' | tr -d '\n')
            echo "::error title=Native Fcitx5 build failed::$details"
            exit "$build_status"
          fi

          set +e
          ctest --test-dir build/native-fcitx5 --output-on-failure 2>&1 | tee build/native-fcitx5/ctest.log
          test_status=${PIPESTATUS[0]}
          set -e
          if (( test_status != 0 )); then
            details=$(tail -n 50 build/native-fcitx5/ctest.log | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/$/%0A/' | tr -d '\n')
            echo "::error title=Native Fcitx5 tests failed::$details"
            exit "$test_status"
          fi

      - name: Verify input method metadata
        run: |
          grep -Fx 'Name=晨星键道（原生）' build/native-fcitx5/eosphoros-native.conf
          grep -Fx 'Addon=eosphoros-native' build/native-fcitx5/eosphoros-native.conf
          grep -Fx 'Library=libeosphoros-native' build/native-fcitx5/eosphoros-native-addon.conf

      - name: Verify native dependency boundary
        shell: bash
        run: |
          addon="$(find build/native-fcitx5 -type f -name '*eosphoros-native*.so' -print -quit)"
          test -n "$addon"
          ldd "$addon" | tee build/native-fcitx5/ldd.txt
          if grep -Eiq '(^|[^a-z])(librime|rime|lua|opencc)([^a-z]|$)' build/native-fcitx5/ldd.txt; then
            echo "Forbidden Rime/Lua/OpenCC dependency detected" >&2
            exit 1
          fi
          ! grep -RIE 'fcitx5-rime|librime|rime/schema|opencc' \
            native/fcitx5-eosphoros/src native/fcitx5-eosphoros/CMakeLists.txt

      - name: Stage install tree
        shell: bash
        run: |
          DESTDIR="$PWD/build/native-install" cmake --install build/native-fcitx5
          test -n "$(find build/native-install -type f -name 'libeosphoros-native.so' -print -quit)"
          test -n "$(find build/native-install -type f -path '*/fcitx5/addon/eosphoros-native.conf' -print -quit)"
          test -n "$(find build/native-install -type f -path '*/fcitx5/inputmethod/eosphoros-native.conf' -print -quit)"
          test -n "$(find build/native-install -type f -name 'eosphoros-native.dict' -print -quit)"
          test -n "$(find build/native-install -type f -name 'eosphoros-native.aux' -print -quit)"
          test -n "$(find build/native-install -type f -name 'fcitx-eosphoros-native.png' -print -quit)"

      - uses: actions/upload-artifact@v7
        with:
          name: eosphoros-fcitx5-native-linux
          path: |
            build/native-install/
            build/native-fcitx5/ldd.txt
          if-no-files-found: error
