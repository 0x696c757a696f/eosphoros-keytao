# encoding: utf-8
---
recipe:
  Rx: recipe/eosphoros/fcitx5-macos-rime-lite
  description: >-
    为 macOS Fcitx5 + Rime 安装或更新晨星键道 Lite 词库档位。
install_files: >-
  default.yaml
  liangfen*.yaml
  pinyin_simp*.yaml
  eosphoros*.ico
  eosphoros.*.dict.yaml
  eosphoros.*.schema.yaml
  eosphoros.schema.yaml
  eosphoros.symbols.yaml
  eosphoros.custom.yaml
  lua/eosphoros/*.lua
  lua/eosphoros/*/*.lua
  opencc/eosphoros/*.lua
  zzc_state/char_parts.tsv
  zzc/README.md
  zzc/自造词使用教程.md
  zzc/自造词使用教程.png
  zzc/eosphoros_词库合并.py
  zzc/eosphoros_撤回合并.py
  dicts/eosphoros/eosphoros.cizu.dict.yaml
  dicts/eosphoros/eosphoros.core.dict.yaml
  dicts/eosphoros/eosphoros.cx.dict.yaml
  dicts/eosphoros/eosphoros.danzi.dict.yaml
  dicts/eosphoros/eosphoros.en.dict.yaml
  dicts/eosphoros/eosphoros.gbk.dict.yaml
  dicts/eosphoros/eosphoros.user.dict.yaml
  dicts/eosphoros/eosphoros.zzc.dict.yaml
  dicts/eosphoros/liangfen.dict.yaml
  dicts/eosphoros/pinyin_simp.dict.yaml
patch_files:
  default.custom.yaml:
    - patch/+:
        schema_list/+/+:
          - schema: eosphoros
  eosphoros.extended.dict.yaml:
    - patch/+:
        import_tables:
          - dicts/eosphoros/eosphoros.user
          - dicts/eosphoros/eosphoros.zzc
          - dicts/eosphoros/eosphoros.danzi
          - dicts/eosphoros/eosphoros.cizu
          - dicts/eosphoros/eosphoros.core
          - dicts/eosphoros/eosphoros.en
