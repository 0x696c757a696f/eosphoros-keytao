    - patch/+:
        schema_list/+/+:
          - schema: eosphoros
  eosphoros.extended.dict.yaml:
    - patch/+:
        import_tables:
          - dicts/eosphoros/eosphoros.user
          - dicts/eosphoros/eosphoros.zzc
          - dicts/eosphoros/eosphoros.danzi
          - dicts/eosphoros/eosphoros.cizu
