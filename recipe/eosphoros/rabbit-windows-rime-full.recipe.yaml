# encoding: utf-8
---
recipe:
  Rx: recipe/eosphoros/rabbit-windows-rime-full
  description: >-
    为 Windows 玉兔毫 安装或更新晨星键道 Full 词库档位。
install_files: >-
  default.yaml
  liangfen*.yaml
  pinyin_simp*.yaml
  eosphoros*.ico
  eosphoros.cx.dict.yaml
  eosphoros.gbk.dict.yaml
  liangfen.dict.yaml
  pinyin_simp.dict.yaml
  eosphoros.*.schema.yaml
  eosphoros.schema.yaml
  eosphoros.symbols.yaml
  eosphoros.custom.yaml
  lua/eosphoros/*.lua
  lua/eosphoros/*/*.lua
  opencc/eosphoros/*.lua
  zzc_state/char_parts.tsv
  zzc/README.md
  zzc/自造词使用教程.md
  zzc/自造词使用教程.png
  zzc/eosphoros_词库合并.py
  zzc/eosphoros_撤回合并.py
  eosphoros.full.dict.yaml
  dicts/eosphoros/eosphoros.assyrian.dict.yaml
  dicts/eosphoros/eosphoros.catholicism.dict.yaml
  dicts/eosphoros/eosphoros.cizu.dict.yaml
  dicts/eosphoros/eosphoros.core.dict.yaml
  dicts/eosphoros/eosphoros.cx.dict.yaml
  dicts/eosphoros/eosphoros.danzi.dict.yaml
  dicts/eosphoros/eosphoros.en.dict.yaml
  dicts/eosphoros/eosphoros.fjcy.dict.yaml
  dicts/eosphoros/eosphoros.gbk.dict.yaml
  dicts/eosphoros/eosphoros.ice.dict.yaml
  dicts/eosphoros/eosphoros.oriental.dict.yaml
  dicts/eosphoros/eosphoros.orthodoxy.dict.yaml
  dicts/eosphoros/eosphoros.protestantism.dict.yaml
  dicts/eosphoros/eosphoros.user.dict.yaml
  dicts/eosphoros/eosphoros.wanxiang.diming.dict.yaml
  dicts/eosphoros/eosphoros.wanxiang.huaxue.dict.yaml
  dicts/eosphoros/eosphoros.wanxiang.jichu.dict.yaml
  dicts/eosphoros/eosphoros.wanxiang.mingren.dict.yaml
  dicts/eosphoros/eosphoros.wanxiang.taifeng.dict.yaml
  dicts/eosphoros/eosphoros.wanxiang.yaopin.dict.yaml
  dicts/eosphoros/eosphoros.wanxiang.yixue.dict.yaml
  dicts/eosphoros/eosphoros.zzc.dict.yaml
  dicts/eosphoros/liangfen.dict.yaml
  dicts/eosphoros/pinyin_simp.dict.yaml
  rabbit_themes.yaml
  zzc/Win_词库合并.exe
  zzc/Win_撤回合并.exe
  zzc/Windows_词库合并.py
  zzc/Windows_撤回合并.py
patch_files:
  default.custom.yaml:
    - patch/+:
        schema_list/+/+:
          - schema: eosphoros
  eosphoros.custom.yaml:
    - patch/+:
        translator/dictionary: eosphoros.full
  rabbit.custom.yaml:
    - patch/+:
        style/color_scheme: EosphorosLight
        style/color_scheme_dark: EosphorosDark
        style/font_face: "Microsoft YaHei UI"
        style/preedit_font_face: "Microsoft YaHei UI"
        style/label_font_face: "Microsoft YaHei UI"
        style/comment_font_face: "Microsoft YaHei UI"
        style/font_point: 16
        style/label_font_point: 15
        style/comment_font_point: 13
        style/label_format: "{:s}. "
        style/layout/margin_x: 8
        style/layout/margin_y: 6
        style/layout/min_width: 220
        preset_color_schemes/EosphorosLight:
          __include: rabbit_themes:/preset_color_schemes/EosphorosLight
        preset_color_schemes/EosphorosDark:
          __include: rabbit_themes:/preset_color_schemes/EosphorosDark
        preset_color_schemes/EosphorosMono:
          __include: rabbit_themes:/preset_color_schemes/EosphorosMono
