  xmjd6.symbols.yaml
  xmjd6.custom.yaml
  lua/xmjd6/*.lua
  lua/xmjd6/*/*.lua
  opencc/xmjd6/*.lua
  zzc_state/char_parts.tsv
  zzc/README.md
  zzc/自造词使用教程.md
  zzc/自造词使用教程.png
  zzc/xmjd6_词库合并.py
  zzc/xmjd6_撤回合并.py
  zzc/Mac_词库合并
  zzc/Mac_撤回合并
  squirrel.yaml
