# encoding: utf-8
---
recipe:
  Rx: fcitx5-macos
  description: >-
    为 macOS Fcitx5 Rime 安装或更新晨星键道核心；Fcitx5 主题需另行导入。
install_files: >-
  default.yaml
  liangfen*.yaml
  pinyin_simp*.yaml
  eosphoros*.ico
  eosphoros.*.dict.yaml
  dicts/eosphoros/*.dict.yaml
  eosphoros.*.schema.yaml
  eosphoros.schema.yaml
  eosphoros.symbols.yaml
  eosphoros.custom.yaml
  lua/eosphoros/*.lua
  lua/eosphoros/*/*.lua
  opencc/eosphoros/*.lua
  zzc_state/char_parts.tsv
  zzc/README.md
  zzc/自造词使用教程.md
  zzc/自造词使用教程.png
  zzc/eosphoros_词库合并.py
  zzc/eosphoros_撤回合并.py
  zzc/Fcitx5_macOS_词库合并.py
  zzc/Fcitx5_macOS_撤回合并.py
patch_files:
  default.custom.yaml:
    - patch/+:
        schema_list/+/+:
          - schema: eosphoros
