# encoding: utf-8
---
recipe:
  Rx: fcitx5-macos
  description: >-
    为 macOS Fcitx5 Rime 安装或更新星猫键道6核心；Fcitx5 主题需另行导入。
install_files: >-
  default.yaml
  liangfen*.yaml
  pinyin_simp*.yaml
  xmjd6.*.dict.yaml
  xmjd6.*.schema.yaml
  xmjd6.schema.yaml
  xmjd6.symbols.yaml
  xmjd6.custom.yaml
  lua/xmjd6/*.lua
  lua/xmjd6/*/*.lua
  opencc/xmjd6/*.lua
  zzc_state/char_parts.tsv
patch_files:
  default.custom.yaml:
    - patch/+:
        schema_list/+/+:
          - schema: xmjd6
