# encoding: utf-8
---
recipe:
  Rx: all
  description: >-
    安装或更新晨星键道通用核心；保留用户自定义配置、用户数据库和自造词运行状态。
install_files: >-
  default.yaml
  liangfen*.yaml
  pinyin_simp*.yaml
  eosphoros*.ico
  eosphoros.*.dict.yaml
  dicts/eosphoros/*.dict.yaml
  eosphoros.*.schema.yaml
  eosphoros.schema.yaml
  eosphoros.symbols.yaml
  eosphoros.custom.yaml
  lua/eosphoros/*.lua
  lua/eosphoros/*/*.lua
  opencc/eosphoros/*.lua
  zzc_state/char_parts.tsv
  zzc/README.md
  zzc/自造词使用教程.md
  zzc/自造词使用教程.png
  zzc/eosphoros_词库合并.py
  zzc/eosphoros_撤回合并.py
patch_files:
  default.custom.yaml:
    - patch/+:
        schema_list/+/+:
          - schema: eosphoros
