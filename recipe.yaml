    安装或更新星猫键道6通用核心；保留用户自定义配置、用户数据库和自造词运行状态。
install_files: >-
  default.yaml
  liangfen*.yaml
  pinyin_simp*.yaml
  xmjd6.ico
  xmjd6.*.dict.yaml
  dicts/xmjd6/*.dict.yaml
  xmjd6.*.schema.yaml
  xmjd6.schema.yaml
  xmjd6.symbols.yaml
  xmjd6.custom.yaml
  lua/xmjd6/*.lua
  lua/xmjd6/*/*.lua
  opencc/xmjd6/*.lua
  zzc_state/char_parts.tsv
  zzc/README.md
  zzc/自造词使用教程.md
  zzc/自造词使用教程.png
  zzc/xmjd6_词库合并.py
  zzc/xmjd6_撤回合并.py
patch_files:
  default.custom.yaml:
    - patch/+:
        schema_list/+/+:
          - schema: xmjd6
